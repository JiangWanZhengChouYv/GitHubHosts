name: GitHubHosts

options:
  bundleIdPrefix: com.markzhang
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptySchemes: false

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  GitHubHosts:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - GitHubHosts
    settings:
      base:
        PRODUCT_NAME: GitHubHosts
        PRODUCT_BUNDLE_IDENTIFIER: com.markzhang.GitHubHosts
        SWIFT_VERSION: "5.0"
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: GitHubHosts/Info.plist
      properties:
        CFBundleName: GitHubHosts
        CFBundleDisplayName: GitHubHosts
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleIconName: AppIcon
        NSAppleEventsUsageDescription: "需要以管理员权限写入 /etc/hosts 并刷新 DNS 缓存。应用会请求一次授权，用于把 GitHub520 hosts 记录写入系统 hosts 文件并执行 killall -HUP mDNSResponder。"

  GitHubHostsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - GitHubHostsTests
    dependencies:
      - target: GitHubHosts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markzhang.GitHubHostsTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GitHubHosts:
    build:
      targets:
        GitHubHosts: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitHubHostsTests
